[package]
name = "lws-client-rs"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
bytes = "=1.11.1"

monero-oxide = { version = "0.1.0", default-features = false, features = ["std"] }
monero-wallet = { version = "0.2.0", default-features = false, features = ["std"] }
monero-wallet-util = { git = "https://github.com/monero-oxide/monero-wallet-util", package = "monero-wallet-util" }
monero-seed = { git = "https://github.com/monero-oxide/monero-wallet-util", package = "monero-seed" }

curve25519-dalek = "4"
rand = "0.8"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.1"
zeroize = "1.6"
hex = "0.4"
libc = "0.2"
thiserror = "2.0"

aead = "0.6"
argon2 = "0.6"
chacha20poly1305 = "0.11"
